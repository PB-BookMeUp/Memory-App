<title>Yaad Rakho</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Noto+Sans:wght@400;600&display=swap">
<style>
  /* Layout: a coach at the top who talks, one big caption that changes sentence by sentence, and the game below. One screen, no scrolling. */
  :root {
    --bg: #f6f3ec; --card: #ffffff; --fg: #1d1a2f; --muted: #5e5a72;
    --accent: #2e2a8f; --accent-fg: #ffffff; --warm: #e8a317;
    --good: #1e8f5a; --bad: #c3412b; --line: #dcd7cb; --tile: #f1eee6;
    --display: "Baloo 2", "Noto Sans", system-ui, sans-serif;
    --body: "Noto Sans", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #15132a; --card: #1f1c3a; --fg: #f3f0ff; --muted: #b7b2cf; --accent: #8f8bff; --accent-fg: #15132a;
      --warm: #ffc247; --good: #4fd08f; --bad: #ff7a63; --line: #3a3660; --tile: #2a2650; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #15132a; --card: #1f1c3a; --fg: #f3f0ff; --muted: #b7b2cf; --accent: #8f8bff; --accent-fg: #15132a;
    --warm: #ffc247; --good: #4fd08f; --bad: #ff7a63; --line: #3a3660; --tile: #2a2650; color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 20px; line-height: 1.4;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 12px; display: flex; flex-direction: column; align-items: center;
  }
  .app { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 12px; flex: 1; min-height: 0; }
  .top { display: flex; justify-content: space-between; align-items: center; font-family: var(--display); font-weight: 700; font-size: 20px; color: var(--accent); }
  .top small { font-family: var(--body); font-weight: 600; font-size: 15px; color: var(--muted); }
  .screen { background: var(--card); border-radius: 22px; padding: 20px; display: flex; flex-direction: column; gap: 16px; flex: 1; min-height: 0; }
  h1 { font-family: var(--display); font-weight: 700; font-size: 32px; line-height: 1.15; margin: 0; text-wrap: balance; }
  p { margin: 0; }
  .muted { color: var(--muted); font-size: 17px; }
  .spacer { flex: 1; }

  /* The coach: a face that pulses while talking, and one caption that follows her voice sentence by sentence. */
  .coach { display: flex; gap: 14px; align-items: flex-start; }
  .face { width: 64px; height: 64px; border-radius: 50%; flex-shrink: 0; background: var(--accent); color: var(--accent-fg); display: grid; place-items: center; cursor: pointer; border: 0; }
  .face svg { width: 44px; height: 44px; }
  .bubble { flex: 1; min-width: 0; background: var(--tile); border-radius: 4px 18px 18px 18px; padding: 14px 16px; font-size: 22px; font-weight: 600; line-height: 1.35; min-height: 3.6em; display: flex; align-items: center; }
  .bubble.done { font-weight: 400; color: var(--muted); font-size: 18px; }
  .hint { font-size: 15px; color: var(--muted); padding-left: 78px; margin-top: -8px; }

  /* Item tiles for the story and the ordering game. */
  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .tiles.four { grid-template-columns: repeat(4, 1fr); }
  .tile { background: var(--tile); border: 2px solid var(--line); border-radius: 16px; padding: 10px 6px; text-align: center; display: grid; gap: 4px; font-weight: 600; font-size: 16px; color: var(--fg); font-family: var(--body); cursor: default; transition: transform .15s; }
  .tile .pic { font-size: 36px; line-height: 1; }
  .tile.hidden-tile { opacity: 0; transform: scale(.6); }
  .tile.pop { animation: pop .35s ease-out; }
  .tile.on { border-color: var(--warm); background: color-mix(in srgb, var(--warm) 14%, var(--card)); }
  button.tile { cursor: pointer; }
  button.tile:disabled { opacity: .35; cursor: default; }
  .tile.good { border-color: var(--good); background: color-mix(in srgb, var(--good) 14%, var(--card)); }
  .tile.shake { animation: shake .4s; border-color: var(--bad); }
  .chain { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; min-height: 44px; }
  .chain .slot { width: 44px; height: 44px; border-radius: 12px; border: 2px dashed var(--line); display: grid; place-items: center; font-size: 26px; }
  .chain .slot.filled { border-style: solid; border-color: var(--good); background: color-mix(in srgb, var(--good) 14%, var(--card)); }
  .chain .arrow { color: var(--muted); font-size: 14px; }

  .btn { font: inherit; font-family: var(--display); font-weight: 700; font-size: 22px; border: 0; border-radius: 16px; padding: 16px 20px; min-height: 64px; cursor: pointer; width: 100%; background: var(--accent); color: var(--accent-fg); }
  .btn.ghost { background: transparent; color: var(--accent); border: 2px solid var(--accent); }
  .btn:disabled { opacity: .4; cursor: default; }
  .btn:focus-visible, .opt:focus-visible, .face:focus-visible, button.tile:focus-visible { outline: 3px solid var(--warm); outline-offset: 3px; }
  .opts { display: grid; gap: 10px; }
  .opt { font: inherit; font-size: 21px; font-weight: 600; text-align: left; border: 2px solid var(--line); background: var(--card); color: var(--fg); border-radius: 14px; padding: 14px 18px; min-height: 60px; cursor: pointer; }
  .opt.right { border-color: var(--good); background: color-mix(in srgb, var(--good) 14%, var(--card)); }
  .opt.wrong { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 12%, var(--card)); }
  .opt:disabled { cursor: default; }

  /* Brain score ring. */
  .ring { display: grid; place-items: center; position: relative; margin: 0 auto; width: 190px; height: 190px; }
  .ring svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 14; }
  .ring .track { stroke: var(--line); }
  .ring .bar { stroke: var(--warm); stroke-linecap: round; stroke-dasharray: 502; stroke-dashoffset: 502; transition: stroke-dashoffset 1.4s ease-out; }
  .ring .num { font-family: var(--display); font-weight: 700; font-size: 64px; line-height: 1; color: var(--warm); font-variant-numeric: tabular-nums; }
  .ring .lbl { font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .ring .in { display: grid; place-items: center; gap: 2px; }

  @media (prefers-reduced-motion: no-preference) {
    .talking .face { animation: pulse 1s ease-in-out infinite; }
    @keyframes pulse { 50% { box-shadow: 0 0 0 10px color-mix(in srgb, var(--accent) 25%, transparent); } }
    @keyframes pop { 0% { transform: scale(.6); opacity: 0; } 70% { transform: scale(1.08); } 100% { transform: scale(1); opacity: 1; } }
    @keyframes shake { 20%,60% { transform: translateX(-6px); } 40%,80% { transform: translateX(6px); } }
  }
</style>

<div class="app">
  <div class="top"><span>Yaad Rakho</span><small id="where">Day 1</small></div>
  <div class="screen" id="screen"></div>
</div>

<script>
// ============ DAY 1 CONTENT. Every word the coach says is here. Edit words here, nothing else. ============
const COACH = "Asha";
const DAY1 = {
  items: [
    { name: "Milk", pic: "🥛" }, { name: "Bread", pic: "🍞" }, { name: "Banana", pic: "🍌" },
    { name: "Soap", pic: "🧼" }, { name: "Tea", pic: "🍵" }, { name: "Eggs", pic: "🥚" },
  ],
  decoys: [{ name: "Rice", pic: "🍚" }, { name: "Onion", pic: "🧅" }],
  intro: [
    `Hello. I'm ${COACH}, your memory coach.`,
    "Today I'll teach you one trick that makes a shopping list impossible to forget.",
    "It takes three minutes. Let's go.",
  ],
  lesson: [
    "Here's the secret.",
    "Our brain is bad at lists. But it is brilliant at stories.",
    "Six words on a list? Gone by evening.",
    "Six things in a silly story? You'll still remember them next week.",
    "The trick is called the Story Chain.",
    "The first thing does something to the second. The second does something to the third. And so on.",
    "The sillier the picture, the better it sticks.",
    "Let me show you with today's list.",
  ],
  // Each story line reveals one tile as it is spoken.
  story: [
    { say: "You are drinking a big glass of milk.", item: 0 },
    { say: "Suddenly, a slice of bread pops out of the milk, floating like a boat.", item: 1 },
    { say: "On the bread sits a banana, smiling at you.", item: 2 },
    { say: "The banana is having a bath, with a pink bar of soap.", item: 3 },
    { say: "The soap makes bubbles, and inside the bubbles, tea leaves are flying around.", item: 4 },
    { say: "The tea leaves fall down and land on six eggs. Crack!", item: 5 },
    { say: "Once more, fast. Milk. Bread. Banana. Soap. Tea. Eggs." },
    { say: "Picture it one more time. Then tap the button." },
  ],
  orderIntro: ["Now the list is hidden.", "Tap the things in the order of the story. Start from the milk."],
  orderNudge: (prev) => `Not yet. Think. What came out of the ${prev}?`,
  orderNudgeFirst: "Not that one. The story started with you drinking something.",
  orderCheer: ["Yes.", "Good.", "That's it.", "Keep going.", "Nearly there.", "You've got the whole chain!"],
  quiz: [
    { q: "What was the banana doing?", opts: ["Sleeping", "Flying", "Having a bath", "Eating bread"], a: 2, why: "The banana was having a bath with pink soap." },
    { q: "Which one was NOT in the story?", opts: ["Rice", "Eggs", "Tea", "Milk"], a: 0, why: "Rice was never in the story." },
    { q: "How many eggs were there at the end?", opts: ["Two", "Four", "Six", "Twelve"], a: 2, why: "Six eggs. The tea leaves landed on them. Crack!" },
  ],
  score: (pts) => pts >= 90 ? [`Your brain score today is ${pts}.`, "That's a sharp memory. You turned six words into a story, and the story stayed."]
    : pts >= 60 ? [`Your brain score today is ${pts}.`, "Good work. The story did most of the remembering for you."]
    : [`Your brain score today is ${pts}.`, "A good start. Tomorrow the story gets sillier, and the score climbs."],
  homework: "Tonight, try it for real. Make a silly story for tomorrow's vegetable list. See you tomorrow.",
};

// ============ VOICE. The phone's own voice, free. Speaks one sentence at a time so the caption can follow. ============
const synth = window.speechSynthesis;
let voice = null, queue = [], speaking = false, watchdog = null;
function pickVoice() {
  if (!synth) return;
  const vs = synth.getVoices();
  voice = vs.find(v => /en[-_]IN/i.test(v.lang)) || vs.find(v => /^en/i.test(v.lang) && /female|woman|Veena|Samantha|Google UK English Female/i.test(v.name)) || vs.find(v => /^en/i.test(v.lang)) || null;
}
pickVoice(); if (synth) synth.onvoiceschanged = pickVoice;

// narrate(sentences, onSentence, onDone): shows each sentence as the voice reaches it. If the voice never starts, captions advance on a timer instead.
function narrate(lines, onSentence, onDone) {
  hush();
  let i = 0;
  const next = () => {
    if (i >= lines.length) { setTalking(false); onDone && onDone(); return; }
    const line = lines[i++];
    onSentence(line, i - 1);
    const ms = 900 + line.split(" ").length * 380;
    if (!synth) { setTalking(true); watchdog = setTimeout(next, ms); return; }
    const u = new SpeechSynthesisUtterance(line);
    if (voice) u.voice = voice;
    u.lang = voice ? voice.lang : "en-IN"; u.rate = 0.92;
    let started = false;
    u.onstart = () => { started = true; clearTimeout(watchdog); setTalking(true); };
    u.onend = () => { clearTimeout(watchdog); next(); };
    u.onerror = () => { clearTimeout(watchdog); watchdog = setTimeout(next, ms); };
    queue.push(u); // keep a reference, or Android drops it mid-sentence
    synth.speak(u);
    watchdog = setTimeout(() => { if (!started) { setTalking(true); watchdog = setTimeout(next, ms); } }, 1500);
  };
  next();
}
function hush() { clearTimeout(watchdog); if (synth) synth.cancel(); queue = []; setTalking(false); }
function setTalking(on) { screenEl.classList.toggle("talking", on); }

// ============ APP ============
const screenEl = document.getElementById("screen");
const whereEl = document.getElementById("where");
let orderScore = 0, quizScore = 0;

const FACE = `<svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="22" fill="currentColor" opacity=".15"/><circle cx="17" cy="20" r="2.6" fill="currentColor"/><circle cx="31" cy="20" r="2.6" fill="currentColor"/><path d="M15 29c3 4.5 15 4.5 18 0" stroke="currentColor" stroke-width="3" stroke-linecap="round" fill="none"/></svg>`;
function coachHTML(hint) {
  return `<div class="coach"><button class="face" id="face" aria-label="Hear ${COACH} again">${FACE}</button><div class="bubble" id="bubble"></div></div><p class="hint">${hint || `Tap ${COACH}'s face to hear it again`}</p>`;
}
function set(html) { screenEl.innerHTML = html; }
function caption(t) { const b = document.getElementById("bubble"); if (b) { b.textContent = t; b.classList.remove("done"); } }
function onFace(fn) { const f = document.getElementById("face"); if (f) f.onclick = fn; }
function onNext(fn) { const n = document.getElementById("next"); if (n) n.onclick = () => { hush(); fn(); }; }
function tileHTML(it, cls = "", attrs = "") { return `<${attrs ? "button" : "div"} class="tile ${cls}" ${attrs}><span class="pic">${it.pic}</span><span>${it.name}</span></${attrs ? "button" : "div"}>`; }
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

// 1. Welcome. The phone only lets sound start after a tap, so this screen is one big button and nothing else.
function welcome() {
  whereEl.textContent = "Day 1";
  set(`<div class="spacer"></div>
    <div style="text-align:center;display:grid;gap:10px;justify-items:center">
      <div class="face" style="width:96px;height:96px" aria-hidden="true">${FACE.replace('viewBox', 'style="width:66px;height:66px" viewBox')}</div>
      <h1>Meet ${COACH}</h1>
      <p class="muted">Your memory coach. Sound on.</p>
    </div>
    <div class="spacer"></div>
    <button class="btn" id="next">Begin Day 1</button>`);
  onNext(() => { if (synth) synth.speak(new SpeechSynthesisUtterance("")); talk(DAY1.intro, "The trick", lesson); });
}

// 2. Coach talks. Caption follows her. The button appears when she is done.
function talk(lines, btnLabel, then) {
  set(`${coachHTML()}<div class="spacer"></div><button class="btn" id="next" disabled>${btnLabel}</button>`);
  const run = () => narrate(lines, caption, () => { document.getElementById("next").disabled = false; });
  onFace(run); onNext(then); run();
}
function lesson() { talk(DAY1.lesson, "Show me the list", story); }

// 3. The story. Each item pops in as she says it.
function story() {
  whereEl.textContent = "The story";
  set(`${coachHTML()}
    <div class="tiles" id="tiles">${DAY1.items.map(it => tileHTML(it, "hidden-tile")).join("")}</div>
    <div class="spacer"></div><button class="btn" id="next" disabled>I can see it. Test me!</button>`);
  const tiles = [...document.querySelectorAll("#tiles .tile")];
  const run = () => {
    tiles.forEach(t => { t.classList.add("hidden-tile"); t.classList.remove("pop", "on"); });
    narrate(DAY1.story.map(s => s.say), (line, i) => {
      caption(line);
      const s = DAY1.story[i];
      tiles.forEach(t => t.classList.remove("on"));
      if (s.item != null) { const t = tiles[s.item]; t.classList.remove("hidden-tile"); t.classList.add("pop", "on"); }
      if (i === 6) tiles.forEach(t => t.classList.remove("hidden-tile"));
    }, () => { document.getElementById("next").disabled = false; });
  };
  onFace(run); onNext(order); run();
}

// 4. Game: tap the items in story order. Two decoys mixed in. First-try correct taps earn points.
function order() {
  whereEl.textContent = "Round 1";
  const pool = shuffle([...DAY1.items, ...DAY1.decoys]);
  let pos = 0, firstTry = true; orderScore = 0;
  set(`${coachHTML("Tap in the order of the story")}
    <div class="chain" id="chain">${DAY1.items.map((_, i) => `<div class="slot" id="slot${i}"></div>${i < 5 ? '<span class="arrow">▶</span>' : ""}`).join("")}</div>
    <div class="tiles four" id="pool">${pool.map((it, i) => tileHTML(it, "", `data-i="${i}"`)).join("")}</div>
    <div class="spacer"></div><button class="btn" id="next" disabled>Next round</button>`);
  onFace(() => narrate(DAY1.orderIntro, caption));
  onNext(quiz);
  narrate(DAY1.orderIntro, caption);
  document.querySelectorAll("#pool .tile").forEach(b => b.onclick = () => {
    const it = pool[+b.dataset.i];
    if (it.name === DAY1.items[pos].name) {
      if (firstTry) orderScore++;
      b.disabled = true; b.classList.add("good");
      const slot = document.getElementById("slot" + pos); slot.textContent = it.pic; slot.classList.add("filled");
      const cheer = DAY1.orderCheer[pos]; pos++; firstTry = true;
      narrate([cheer], caption, () => { if (pos === 6) document.getElementById("next").disabled = false; });
    } else {
      firstTry = false;
      b.classList.remove("shake"); void b.offsetWidth; b.classList.add("shake");
      narrate([pos === 0 ? DAY1.orderNudgeFirst : DAY1.orderNudge(DAY1.items[pos - 1].name.toLowerCase())], caption);
    }
  });
}

// 5. Three quick questions about the story.
function quiz(qi = 0) {
  if (qi === 0) quizScore = 0;
  if (qi >= DAY1.quiz.length) return score();
  whereEl.textContent = `Round 2 · ${qi + 1} of ${DAY1.quiz.length}`;
  const q = DAY1.quiz[qi]; let answered = false;
  set(`${coachHTML()}
    <div class="opts">${q.opts.map((o, i) => `<button class="opt" data-i="${i}">${o}</button>`).join("")}</div>
    <div class="spacer"></div><button class="btn" id="next" disabled>${qi + 1 === DAY1.quiz.length ? "See my score" : "Next question"}</button>`);
  onFace(() => narrate([q.q], caption)); onNext(() => quiz(qi + 1));
  narrate([q.q], caption);
  document.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    if (answered) return; answered = true;
    const ok = +b.dataset.i === q.a; if (ok) quizScore++;
    document.querySelectorAll(".opt").forEach(x => { x.disabled = true; if (+x.dataset.i === q.a) x.classList.add("right"); });
    if (!ok) b.classList.add("wrong");
    narrate([ok ? "Correct." : "Not this one. " + q.why], caption);
    document.getElementById("next").disabled = false;
  });
}

// 6. Score. 10 for finishing, 10 per item placed first try, 10 per question. Perfect day is 100.
function score() {
  whereEl.textContent = "Day 1 done";
  const pts = 10 + orderScore * 10 + quizScore * 10;
  try { localStorage.setItem("yaad.day1", JSON.stringify({ pts, when: Date.now() })); } catch (e) {}
  set(`${coachHTML()}
    <div class="ring"><svg viewBox="0 0 180 180"><circle class="track" cx="90" cy="90" r="80"/><circle class="bar" id="bar" cx="90" cy="90" r="80"/></svg>
      <div class="in"><span class="lbl">Brain score</span><span class="num" id="num">0</span></div></div>
    <p class="muted" style="text-align:center">${orderScore} of 6 in order · ${quizScore} of 3 questions</p>
    <div class="spacer"></div><button class="btn ghost" id="next">Play Day 1 again</button>`);
  const lines = [...DAY1.score(pts), DAY1.homework];
  const run = () => narrate(lines, caption);
  onFace(run); onNext(welcome); run();
  requestAnimationFrame(() => {
    document.getElementById("bar").style.strokeDashoffset = 502 - 502 * pts / 100;
    let n = 0; const t = setInterval(() => { n = Math.min(pts, n + 3); document.getElementById("num").textContent = n; if (n >= pts) clearInterval(t); }, 35);
  });
}

welcome();
</script>
