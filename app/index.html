<title>Yaad Rakho</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Noto+Sans:wght@400;600&display=swap">
<style>
  /* Layout: a coach at the top who talks, one big caption that changes sentence by sentence, and the game below. One screen, no scrolling. */
  :root {
    --bg: #f6f3ec; --card: #ffffff; --fg: #1d1a2f; --muted: #5e5a72;
    --accent: #2e2a8f; --accent-fg: #ffffff; --warm: #e8a317;
    --good: #1e8f5a; --bad: #c3412b; --line: #dcd7cb; --tile: #f1eee6;
    --display: "Baloo 2", "Noto Sans", system-ui, sans-serif;
    --body: "Noto Sans", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #15132a; --card: #1f1c3a; --fg: #f3f0ff; --muted: #b7b2cf; --accent: #8f8bff; --accent-fg: #15132a;
      --warm: #ffc247; --good: #4fd08f; --bad: #ff7a63; --line: #3a3660; --tile: #2a2650; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #15132a; --card: #1f1c3a; --fg: #f3f0ff; --muted: #b7b2cf; --accent: #8f8bff; --accent-fg: #15132a;
    --warm: #ffc247; --good: #4fd08f; --bad: #ff7a63; --line: #3a3660; --tile: #2a2650; color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 20px; line-height: 1.4;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 12px; display: flex; flex-direction: column; align-items: center;
  }
  .app { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 12px; flex: 1; min-height: 0; }
  .top { display: flex; justify-content: space-between; align-items: center; font-family: var(--display); font-weight: 700; font-size: 20px; color: var(--accent); }
  .top small { font-family: var(--body); font-weight: 600; font-size: 15px; color: var(--muted); }
  .screen { background: var(--card); border-radius: 22px; padding: 20px; display: flex; flex-direction: column; gap: 16px; flex: 1; min-height: 0; }
  h1 { font-family: var(--display); font-weight: 700; font-size: 34px; line-height: 1.1; margin: 0; text-wrap: balance; }
  p { margin: 0; }
  .muted { color: var(--muted); font-size: 17px; }
  .spacer { flex: 1; }

  /* Opening screen */
  .open { text-align: center; display: grid; gap: 12px; justify-items: center; }
  .open .face { width: 110px; height: 110px; }
  .open .face svg { width: 76px; height: 76px; }
  .open .day { display: inline-block; background: var(--warm); color: #1d1a2f; font-family: var(--display); font-weight: 700; font-size: 16px; padding: 4px 14px; border-radius: 999px; letter-spacing: .04em; }
  .open .steps { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; font-size: 15px; color: var(--muted); font-weight: 600; }
  .open .steps span { background: var(--tile); border-radius: 999px; padding: 6px 12px; }

  /* The coach: a face that pulses while talking, and one caption that follows her voice sentence by sentence. */
  .coach { display: flex; gap: 14px; align-items: flex-start; }
  .face { width: 64px; height: 64px; border-radius: 50%; flex-shrink: 0; background: var(--accent); color: var(--accent-fg); display: grid; place-items: center; cursor: pointer; border: 0; }
  .face svg { width: 44px; height: 44px; }
  .bubble { flex: 1; min-width: 0; background: var(--tile); border-radius: 4px 18px 18px 18px; padding: 14px 16px; font-size: 22px; font-weight: 600; line-height: 1.35; min-height: 3.6em; display: flex; align-items: center; }
  .hint { font-size: 15px; color: var(--muted); padding-left: 78px; margin-top: -8px; }

  /* Item tiles for the story and the ordering game. */
  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .tiles.four { grid-template-columns: repeat(4, 1fr); }
  .tile { background: var(--tile); border: 2px solid var(--line); border-radius: 16px; padding: 10px 6px; text-align: center; display: grid; gap: 4px; font-weight: 600; font-size: 16px; color: var(--fg); font-family: var(--body); cursor: default; transition: transform .15s; }
  .tile .pic { font-size: 38px; line-height: 1; }
  .tile.hidden-tile { opacity: 0; transform: scale(.6); }
  .tile.pop { animation: pop .35s ease-out; }
  .tile.on { border-color: var(--warm); background: color-mix(in srgb, var(--warm) 14%, var(--card)); }
  button.tile { cursor: pointer; }
  button.tile:disabled { opacity: .35; cursor: default; }
  .tile.good { border-color: var(--good); background: color-mix(in srgb, var(--good) 14%, var(--card)); }
  .tile.shake { animation: shake .4s; border-color: var(--bad); }
  .chain { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; min-height: 44px; }
  .chain .slot { width: 44px; height: 44px; border-radius: 12px; border: 2px dashed var(--line); display: grid; place-items: center; font-size: 26px; }
  .chain .slot.filled { border-style: solid; border-color: var(--good); background: color-mix(in srgb, var(--good) 14%, var(--card)); }
  .chain .arrow { color: var(--muted); font-size: 14px; }

  .btn { font: inherit; font-family: var(--display); font-weight: 700; font-size: 22px; border: 0; border-radius: 16px; padding: 16px 20px; min-height: 64px; cursor: pointer; width: 100%; background: var(--accent); color: var(--accent-fg); }
  .btn.ghost { background: transparent; color: var(--accent); border: 2px solid var(--accent); }
  .btn:disabled { opacity: .4; cursor: default; }
  .btn:focus-visible, .opt:focus-visible, .face:focus-visible, button.tile:focus-visible { outline: 3px solid var(--warm); outline-offset: 3px; }
  .opts { display: grid; gap: 10px; }
  .opt { font: inherit; font-size: 21px; font-weight: 600; text-align: left; border: 2px solid var(--line); background: var(--card); color: var(--fg); border-radius: 14px; padding: 14px 18px; min-height: 60px; cursor: pointer; }
  .opt.right { border-color: var(--good); background: color-mix(in srgb, var(--good) 14%, var(--card)); }
  .opt.wrong { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 12%, var(--card)); }
  .opt:disabled { cursor: default; }

  /* Brain score ring. */
  .ring { display: grid; place-items: center; position: relative; margin: 0 auto; width: 190px; height: 190px; }
  .ring svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 14; }
  .ring .track { stroke: var(--line); }
  .ring .bar { stroke: var(--warm); stroke-linecap: round; stroke-dasharray: 502; stroke-dashoffset: 502; transition: stroke-dashoffset 1.4s ease-out; }
  .ring .num { font-family: var(--display); font-weight: 700; font-size: 64px; line-height: 1; color: var(--warm); font-variant-numeric: tabular-nums; }
  .ring .lbl { font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .ring .in { display: grid; place-items: center; gap: 2px; }

  @media (prefers-reduced-motion: no-preference) {
    .talking .face { animation: pulse 1s ease-in-out infinite; }
    @keyframes pulse { 50% { box-shadow: 0 0 0 10px color-mix(in srgb, var(--accent) 25%, transparent); } }
    @keyframes pop { 0% { transform: scale(.6); opacity: 0; } 70% { transform: scale(1.08); } 100% { transform: scale(1); opacity: 1; } }
    @keyframes shake { 20%,60% { transform: translateX(-6px); } 40%,80% { transform: translateX(6px); } }
  }
</style>

<div class="app">
  <div class="top"><span>Yaad Rakho</span><small id="where">Day 1</small></div>
  <div class="screen" id="screen"></div>
</div>
<audio id="player" preload="auto"></audio>

<script>
// Content (words, items, quiz) lives in content/day1.json. Audio for every line lives in audio/day1/<id>.mp3.
// This file only decides what happens on screen.
let C = null;
const screenEl = document.getElementById("screen"), whereEl = document.getElementById("where"), player = document.getElementById("player");
let orderScore = 0, quizScore = 0;

// ---------- Voice. One <audio> element reused for every line, because phones only unlock sound on the element the user first tapped. ----------
let seq = 0, watchdog = null;
function hush() { seq++; clearTimeout(watchdog); player.pause(); player.onended = player.onerror = null; setTalking(false); }
function setTalking(on) { screenEl.classList.toggle("talking", on); }
// narrate(ids, onLine, onDone): plays each line's audio in turn and shows its caption. If a clip can't play, the caption stays for a reading-length pause.
function narrate(ids, onLine, onDone) {
  hush();
  const my = seq; let i = 0;
  const next = () => {
    if (my !== seq) return;
    if (i >= ids.length) { setTalking(false); onDone && onDone(); return; }
    const id = ids[i++], text = C.lines[id];
    onLine && onLine(text, i - 1, id);
    const ms = 900 + text.split(" ").length * 380;
    const fallback = () => { if (my !== seq) return; setTalking(true); watchdog = setTimeout(next, ms); };
    player.onended = () => { if (my === seq) next(); };
    player.onerror = fallback;
    player.src = `audio/day${C.day}/${id}.mp3`;
    setTalking(true);
    const p = player.play();
    if (p && p.catch) p.catch(fallback);
  };
  next();
}

// ---------- Screen helpers ----------
const FACE = `<svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="22" fill="currentColor" opacity=".15"/><circle cx="17" cy="20" r="2.6" fill="currentColor"/><circle cx="31" cy="20" r="2.6" fill="currentColor"/><path d="M15 29c3 4.5 15 4.5 18 0" stroke="currentColor" stroke-width="3" stroke-linecap="round" fill="none"/></svg>`;
function coachHTML(hint) {
  return `<div class="coach"><button class="face" id="face" aria-label="Hear ${C.coach} again">${FACE}</button><div class="bubble" id="bubble"></div></div><p class="hint">${hint || `Tap ${C.coach}'s face to hear it again`}</p>`;
}
function set(html) { screenEl.innerHTML = html; }
function caption(t) { const b = document.getElementById("bubble"); if (b) b.textContent = t; }
function onFace(fn) { const f = document.getElementById("face"); if (f) f.onclick = fn; }
function onNext(fn) { const n = document.getElementById("next"); if (n) n.onclick = () => { hush(); fn(); }; }
function enableNext() { const n = document.getElementById("next"); if (n) n.disabled = false; }
function tileHTML(it, cls = "", attrs = "") { const tag = attrs ? "button" : "div"; return `<${tag} class="tile ${cls}" ${attrs}><span class="pic">${it.pic}</span><span>${it.name}</span></${tag}>`; }
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function ids(prefix, n) { return Array.from({ length: n }, (_, i) => `${prefix}_${i}`); }

// 1. Opening. Says what this is, what today is, and how long it takes. One button. The first tap also unlocks sound on the phone.
function welcome() {
  whereEl.textContent = `Day ${C.day}`;
  set(`<div class="spacer"></div>
    <div class="open">
      <div class="face" aria-hidden="true">${FACE}</div>
      <span class="day">Day ${C.day} · ${C.title}</span>
      <h1>Three minutes a day for a sharper memory.</h1>
      <p class="muted">${C.coach} talks you through it. Turn your sound on.</p>
      <div class="steps"><span>Learn the trick</span><span>Hear a story</span><span>Play 2 rounds</span></div>
    </div>
    <div class="spacer"></div>
    <button class="btn" id="next">Start Day ${C.day}</button>`);
  onNext(() => talk(ids("intro", 3), "What's the trick?", lesson));
}

// 2. Coach talks. Caption follows her. The button lights up when she is done.
function talk(lineIds, btnLabel, then) {
  set(`${coachHTML()}<div class="spacer"></div><button class="btn" id="next" disabled>${btnLabel}</button>`);
  const run = () => narrate(lineIds, caption, enableNext);
  onFace(run); onNext(then); run();
}
function lesson() { whereEl.textContent = "The trick"; talk(ids("lesson", 8), "Show me the list", story); }

// 3. The story. Each item pops in as she says it.
function story() {
  whereEl.textContent = "The story";
  set(`${coachHTML()}
    <div class="tiles" id="tiles">${C.items.map(it => tileHTML(it, "hidden-tile")).join("")}</div>
    <div class="spacer"></div><button class="btn" id="next" disabled>I can see it. Test me!</button>`);
  const tiles = [...document.querySelectorAll("#tiles .tile")];
  const run = () => {
    tiles.forEach(t => { t.classList.add("hidden-tile"); t.classList.remove("pop", "on"); });
    narrate(ids("story", 8), (line, i) => {
      caption(line);
      tiles.forEach(t => t.classList.remove("on"));
      if (i < 6) { tiles[i].classList.remove("hidden-tile"); tiles[i].classList.add("pop", "on"); }
      if (i === 6) tiles.forEach(t => t.classList.remove("hidden-tile"));
    }, enableNext);
  };
  onFace(run); onNext(order); run();
}

// 4. Round 1: tap the items in story order. Two decoys mixed in. First-try correct taps earn points.
function order() {
  whereEl.textContent = "Round 1 of 2";
  const pool = shuffle([...C.items, ...C.decoys]);
  let pos = 0, firstTry = true; orderScore = 0;
  set(`${coachHTML("Tap in the order of the story")}
    <div class="chain" id="chain">${C.items.map((_, i) => `<div class="slot" id="slot${i}"></div>${i < 5 ? '<span class="arrow">▶</span>' : ""}`).join("")}</div>
    <div class="tiles four" id="pool">${pool.map((it, i) => tileHTML(it, "", `data-i="${i}"`)).join("")}</div>
    <div class="spacer"></div><button class="btn" id="next" disabled>Round 2</button>`);
  onFace(() => narrate(ids("order", 2), caption));
  onNext(() => quiz(0));
  narrate(ids("order", 2), caption);
  document.querySelectorAll("#pool .tile").forEach(b => b.onclick = () => {
    const it = pool[+b.dataset.i];
    if (it.name === C.items[pos].name) {
      if (firstTry) orderScore++;
      b.disabled = true; b.classList.add("good");
      const slot = document.getElementById("slot" + pos); slot.textContent = it.pic; slot.classList.add("filled");
      const cheer = `cheer_${pos}`; pos++; firstTry = true;
      narrate([cheer], caption, () => { if (pos === 6) enableNext(); });
      if (pos === 6) enableNext();
    } else {
      firstTry = false;
      b.classList.remove("shake"); void b.offsetWidth; b.classList.add("shake");
      narrate([pos === 0 ? "nudge_first" : `nudge_${pos}`], caption);
    }
  });
}

// 5. Round 2: three quick questions about the story.
function quiz(qi) {
  if (qi === 0) quizScore = 0;
  if (qi >= C.quiz.length) return score();
  whereEl.textContent = `Round 2 · Question ${qi + 1} of ${C.quiz.length}`;
  const q = C.quiz[qi]; let answered = false;
  set(`${coachHTML()}
    <div class="opts">${q.opts.map((o, i) => `<button class="opt" data-i="${i}">${o}</button>`).join("")}</div>
    <div class="spacer"></div><button class="btn" id="next" disabled>${qi + 1 === C.quiz.length ? "See my score" : "Next question"}</button>`);
  onFace(() => narrate([q.id], caption)); onNext(() => quiz(qi + 1));
  narrate([q.id], caption);
  document.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    if (answered) return; answered = true;
    const ok = +b.dataset.i === q.a; if (ok) quizScore++;
    document.querySelectorAll(".opt").forEach(x => { x.disabled = true; if (+x.dataset.i === q.a) x.classList.add("right"); });
    if (!ok) b.classList.add("wrong");
    narrate([ok ? "correct" : `${q.id}_no`], caption);
    enableNext();
  });
}

// 6. Score. 10 for finishing, 10 per item placed first try, 10 per question right. A perfect day is 100.
function score() {
  whereEl.textContent = `Day ${C.day} done`;
  const pts = 10 + orderScore * 10 + quizScore * 10;
  try { localStorage.setItem(`yaad.day${C.day}`, JSON.stringify({ pts, when: Date.now() })); } catch (e) {}
  set(`${coachHTML()}
    <div class="ring"><svg viewBox="0 0 180 180"><circle class="track" cx="90" cy="90" r="80"/><circle class="bar" id="bar" cx="90" cy="90" r="80"/></svg>
      <div class="in"><span class="lbl">Brain score</span><span class="num" id="num">0</span></div></div>
    <p class="muted" style="text-align:center">${orderScore} of 6 in order · ${quizScore} of 3 questions</p>
    <div class="spacer"></div><button class="btn ghost" id="next">Play Day ${C.day} again</button>`);
  const tier = pts >= 90 ? "score_hi" : pts >= 60 ? "score_mid" : "score_lo";
  const run = () => narrate(["score_intro", tier, "homework"], caption);
  onFace(run); onNext(welcome); run();
  requestAnimationFrame(() => {
    document.getElementById("bar").style.strokeDashoffset = 502 - 502 * pts / 100;
    let n = 0; const t = setInterval(() => { n = Math.min(pts, n + 3); document.getElementById("num").textContent = n; if (n >= pts) clearInterval(t); }, 35);
  });
}

fetch("content/day1.json").then(r => r.json()).then(c => { C = c; welcome(); })
  .catch(() => set(`<h1>Couldn't load today's lesson.</h1><p class="muted">Check your connection and open the link again.</p>`));
</script>
