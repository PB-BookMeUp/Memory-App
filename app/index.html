<style>

  }

  :root[data-theme="dark"][data-skin="wa"] { --bg: #0b141a; --chat: #0b141a; --card: #202c33; --fg: #e9edef; --muted: #8696a0; --head: #202c33; --head-fg: #e9edef; --in: #202c33; --out: #005c4b; --out-fg: #e9edef; --accent: #00a884; --accent-fg: #0b141a; --warm: #ffb02e; --warm-soft: #3a2f14; --good: #25d366; --bad: #f15c6d; --line: #2a3942; --tile: #111b21; --chip: #202c33; --chip-fg: #00a884; --chip-line: #2a3942; }

  html, body { height: 100%; }

  .chip:focus-visible, .composer input:focus-visible, .composer button:focus-visible, button.tile:focus-visible, .tab:focus-visible, .skin button:focus-visible { outline: 3px solid var(--warm); outline-offset: 2px; }

  /* Tiles inside cards */

  button.tile { cursor: pointer; } button.tile:disabled { opacity: .35; cursor: default; }
  .tile.sel { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, var(--card)); }

  .chain { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }

  .chain .arrow { color: var(--muted); font-size: 11px; }
  .timer { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }

  .compare { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; text-align: center; }

  .compare span { font-size: 12px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .05em; }
  .ring { display: grid; place-items: center; position: relative; margin: 0 auto; width: 150px; height: 150px; }

  .ring circle { fill: none; stroke-width: 13; } .ring .track { stroke: var(--line); }

  .ring .num { font-family: var(--display); font-weight: 800; font-size: 50px; line-height: 1; color: var(--warm); font-variant-numeric: tabular-nums; }
  .ring .lbl { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
  .ring .in { display: grid; place-items: center; gap: 2px; }

  /* Home, progress, family: plain screens under the same header */
  .screen { flex: 1; min-height: 0; overflow-y: auto; padding: 14px max(14px, env(safe-area-inset-right, 0px)) 14px max(14px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 12px; }
  h2 { font-family: var(--display); font-weight: 700; font-size: 22px; line-height: 1.15; margin: 0; }
  p { margin: 0; } .muted { color: var(--muted); font-size: 15px; } .center { text-align: center; }
  .hero { background: var(--head); color: var(--head-fg); border-radius: var(--radius); padding: 16px; display: grid; gap: 8px; }
  .hero .eyebrow { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; font-weight: 700; opacity: .8; }
  .btn { font: inherit; font-family: var(--display); font-weight: 700; font-size: 19px; border: 0; border-radius: 14px; padding: 12px 16px; min-height: 54px; cursor: pointer; width: 100%; background: var(--warm); color: #1d1a2f; }

  .stat b { font-family: var(--display); font-weight: 800; font-size: 26px; line-height: 1; color: var(--accent); font-variant-numeric: tabular-nums; }
  .stat span { font-size: 11px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .05em; }
  .week { display: flex; gap: 4px; }
  .week div { flex: 1; text-align: center; display: grid; gap: 4px; font-size: 11px; color: var(--muted); font-weight: 700; }
  .week i { display: block; height: 9px; border-radius: 5px; background: var(--line); }
  .week i.on { background: var(--good); } .week i.today { outline: 2px solid var(--accent); outline-offset: 1px; }
  .path { display: grid; gap: 6px; }
  .path .day { display: flex; gap: 10px; align-items: center; padding: 9px 12px; border-radius: 14px; background: var(--card); }
  .path .day.locked { opacity: .55; }
  .path .day .n { width: 34px; height: 34px; border-radius: 50%; background: var(--tile); border: 2px solid var(--line); display: grid; place-items: center; font-family: var(--display); font-weight: 800; flex-shrink: 0; }
  .path .day.done .n { background: var(--good); border-color: var(--good); color: #fff; }
  .path .day.next .n { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
  .path .day small { display: block; color: var(--muted); font-size: 12px; }
  .chart { width: 100%; height: auto; aspect-ratio: 2 / 1; max-width: 100%; }
  .chart .axis { stroke: var(--line); stroke-width: 1; } .chart .line { fill: none; stroke: var(--accent); stroke-width: 3; stroke-linejoin: round; }
  .chart .dot { fill: var(--warm); stroke: var(--card); stroke-width: 2; } .chart text { fill: var(--muted); font-size: 11px; font-family: var(--body); }
  .badges { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .badge { background: var(--card); border-radius: 14px; padding: 10px 6px; text-align: center; display: grid; gap: 4px; font-size: 12px; font-weight: 600; color: var(--muted); }
  .badge .pic { font-size: 26px; } .badge.on { background: var(--warm-soft); color: var(--fg); } .badge:not(.on) .pic { filter: grayscale(1); opacity: .5; }
  .member { display: grid; grid-template-columns: 30px 1fr auto auto; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 14px; background: var(--card); }
  .member.me { outline: 2px solid var(--accent); }
  .member .rank { font-family: var(--display); font-weight: 800; color: var(--muted); font-size: 17px; }
  .member .name { font-weight: 700; font-size: 17px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .member .name small { display: block; font-size: 12px; color: var(--muted); font-weight: 600; }

  .code { font-family: var(--display); font-weight: 800; font-size: 32px; letter-spacing: .18em; color: var(--accent); text-align: center; background: var(--card); border-radius: 14px; padding: 10px; }
  input[type=text].plain { font: inherit; font-size: 20px; font-weight: 600; padding: 12px 14px; border: 2px solid var(--line); border-radius: 14px; background: var(--card); color: var(--fg); width: 100%; box-sizing: border-box; text-align: center; }
  .tabs { display: flex; background: var(--card); border-top: 1px solid var(--line); padding: 6px max(10px, env(safe-area-inset-right, 0px)) max(8px, env(safe-area-inset-bottom, 0px)) max(10px, env(safe-area-inset-left, 0px)); flex-shrink: 0; }

<div class="app">
  <div class="head">
    <div class="face" id="headface"></div>

  <div class="reply" id="reply" hidden></div>

    <button class="tab" data-go="home"><span class="pic">🏠</span>Aaj</button>
    <button class="tab" data-go="progress"><span class="pic">📈</span>Progress</button>
    <button class="tab" data-go="family"><span class="pic">👨‍👩‍👧</span>Family</button>
  </nav>
</div>

<script>
// ============================================================
// Yaad Rakho. A chat with Priya. Words live in content/*.json. This file is the screens and the chat engine.
// ============================================================
let A = null, D = null;
const $ = id => document.getElementById(id);
const chatEl = $("chat"), replyEl = $("reply"), screenEl = $("screen"), tabsEl = $("tabs");
const FACE = `<svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="22" fill="currentColor" opacity=".15"/><circle cx="17" cy="20" r="2.6" fill="currentColor"/><circle cx="31" cy="20" r="2.6" fill="currentColor"/><path d="M15 29c3 4.5 15 4.5 18 0" stroke="currentColor" stroke-width="3" stroke-linecap="round" fill="none"/></svg>`;
$("headface").innerHTML = FACE;

// ---------- Skin switch (Yaad look or WhatsApp-like look). Remembered on this phone. ----------
function setSkin(s) { document.documentElement.dataset.skin = s; try { localStorage.setItem("yaad.skin", s); } catch (e) {} document.querySelectorAll(".skin button").forEach(b => b.classList.toggle("on", b.dataset.skin === s)); }
document.querySelectorAll(".skin button").forEach(b => b.onclick = () => setSkin(b.dataset.skin));
let skin0 = "yaad"; try { skin0 = localStorage.getItem("yaad.skin") || "yaad"; } catch (e) {} setSkin(skin0);

// ---------- Her data, on her phone ----------
const S = load();
function load() { try { return Object.assign({ name: "", forget: "", age: "", slot: "", before: null, days: {}, family: "", id: "", scoreLog: [] }, JSON.parse(localStorage.getItem("yaad") || "{}")); } catch (e) { return { name: "", days: {}, scoreLog: [] }; } }
function save() { try { localStorage.setItem("yaad", JSON.stringify(S)); } catch (e) {} }
if (!S.id) { S.id = Math.random().toString(36).slice(2, 10); save(); }
const today = () => new Date().toISOString().slice(0, 10);
const daysAgo = iso => Math.round((Date.parse(today()) - Date.parse(iso)) / 86400000);
function brainScore() { const v = Object.values(S.days); return v.length ? v[v.length - 1].pts : (S.before == null ? 0 : Math.round(S.before / 6 * 40)); }
function streak() { let n = 0, d = new Date(); const done = new Set(Object.values(S.days).map(x => x.date)); if (!done.has(today())) d.setDate(d.getDate() - 1); while (done.has(d.toISOString().slice(0, 10))) { n++; d.setDate(d.getDate() - 1); } return n; }
function weekId() { const d = new Date(), j = new Date(d.getFullYear(), 0, 1); return d.getFullYear() + "-W" + Math.ceil(((d - j) / 86400000 + j.getDay() + 1) / 7); }
function weekStart() { const d = new Date(); d.setDate(d.getDate() - d.getDay()); return d.toISOString().slice(0, 10); }

// ---------- Chat engine ----------
const wait = ms => new Promise(r => setTimeout(r, ms));
function mode(m) { chatEl.hidden = replyEl.hidden = m !== "chat"; screenEl.hidden = tabsEl.hidden = m !== "screen"; }
function scroll() { chatEl.scrollTop = chatEl.scrollHeight; }
function add(html, cls = "msg in") { const d = document.createElement("div"); d.className = cls; d.innerHTML = html; chatEl.appendChild(d); scroll(); return d; }
// Priya sends a message. Typing dots first, timed by its length, so it reads like a person.
async function say(text, opts = {}) {
  const t = add(`<i></i><i></i><i></i>`, "typing"); await wait(Math.min(1800, 500 + text.split(" ").length * 70)); t.remove();
  let html = text; if (opts.pic) html = `<span class="pic">${opts.pic}</span>${text}`;
  if (opts.scene) html = `<span class="scene">${opts.scene}</span>${text}`;
  const m = add(html, "msg in" + (opts.big ? " big" : "")); await wait(opts.pause ?? 350); return m;
}
async function burst(lines, opts) { for (const l of lines) await say(l, opts); }
function mine(text) { add(text, "msg out"); }
function card(html) { return add(html, "card"); }
function stamp(text) { add(text, "day-chip"); }
// Quick replies. Resolves with the chosen option, after echoing it as her message.
function ask(options, opts = {}) {
  return new Promise(res => {
    replyEl.innerHTML = options.map((o, i) => `<button class="chip ${options.length === 1 ? "primary wide" : ""} ${o.primary ? "primary" : ""}" data-i="${i}">${o.label || o}</button>`).join("");
    replyEl.querySelectorAll(".chip").forEach(b => b.onclick = () => { const o = options[+b.dataset.i]; replyEl.innerHTML = ""; if (!opts.silent) mine(o.label || o); res(o); });
    scroll();
  });
}
function askText(placeholder) {
  return new Promise(res => {
    replyEl.innerHTML = `<form class="composer" id="cf"><input type="text" id="ci" placeholder="${placeholder}" maxlength="20" autocomplete="given-name"><button type="submit" aria-label="Send">➤</button></form>`;
    const f = $("cf"); $("ci").focus(); f.onsubmit = e => { e.preventDefault(); const v = $("ci").value.trim(); if (!v) return; replyEl.innerHTML = ""; mine(v); res(v); };
  });
}
function tile(it, cls = "", attrs = "") { const t = attrs ? "button" : "div"; return `<${t} class="tile ${cls}" ${attrs}><span class="pic">${it.pic}</span><span>${it.name}</span></${t}>`; }
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

// Memory test as a card: items for 15 seconds, then a grid to tap what you remember. Resolves with how many were right.
async function memoryTest(items, decoys) {
  const c = card(`<div class="tiles">${items.map(it => tile(it)).join("")}</div><div class="timer"><i id="bar"></i></div>`);
  const bar = c.querySelector("#bar"); bar.style.transitionDuration = "15s"; await wait(50); bar.style.width = "0%"; await wait(15000);
  c.innerHTML = `<h3>Jo yaad hain, un par tap kijiye</h3><div class="tiles four" id="pool"></div>`;
  const pool = shuffle([...items, ...decoys]); c.querySelector("#pool").innerHTML = pool.map((it, i) => tile(it, "", `data-i="${i}"`)).join(""); scroll();
  const chosen = new Set();
  return new Promise(res => {
    c.querySelectorAll(".tile").forEach(b => b.onclick = () => { const i = +b.dataset.i; chosen.has(i) ? chosen.delete(i) : chosen.add(i); b.classList.toggle("sel", chosen.has(i)); if (chosen.size && !replyEl.innerHTML) ask([{ label: "Ho gaya", primary: true }], { silent: true }).then(check); });
    function check() {
      const names = new Set(items.map(x => x.name)); let right = 0;
      c.querySelectorAll(".tile").forEach(b => { const it = pool[+b.dataset.i]; b.disabled = true; if (chosen.has(+b.dataset.i)) { b.classList.add(names.has(it.name) ? "good" : "miss"); if (names.has(it.name)) right++; } });
      mine(`${right} of 6`); setTimeout(() => res(right), 900);
    }
  });
}

// ============ FIRST OPEN, as a chat ============

// ============ DAY 1, as a chat ============
let orderScore = 0, quizScore = 0;
async function session(fromOnboard) {
  mode("chat"); if (!fromOnboard) { chatEl.innerHTML = ""; stamp(`Day 1 · ${D.title}`); } else stamp(`Day 1 · ${D.title}`);
  await burst(D.chat.intro);
  await ask(["Kya trick?"]);
  await say(D.chat.lesson[0], { scene: `<span>📝</span><span class="arrow">▶</span><span>💨</span>` });
  await say(D.chat.lesson[1], { scene: `<span>📖</span><span class="arrow">▶</span><span>🧠</span>` });
  await say(D.chat.lesson[2], { big: true });
  await ask(["Kaise?"]);
  await burst(D.chat.lesson.slice(3));
  await ask([{ label: "List dikhao", primary: true }]);
  // The story, one picture message per line. The previous item shows small, so the chain is visible.
  card(`<h3>Aaj ki list</h3><div class="tiles">${D.items.map(it => tile(it)).join("")}</div>`);
  await say(D.chat.storyIntro);
  for (let i = 0; i < 6; i++) {
    const prev = i ? `<span class="small">${D.items[i - 1].pic}</span><span class="arrow">▶</span>` : "";
    await say(D.chat.story[i], { scene: `${prev}<span>${D.items[i].pic}</span>`, pause: 700 });
  }
  await say(D.chat.story[6], { scene: D.items.map(it => `<span class="small" style="opacity:1">${it.pic}</span>`).join(`<span class="arrow">▶</span>`) });
  await say(D.chat.story[7]);
  await ask([{ label: "Dikh gaya. Test lo!", primary: true }]);
  await orderGame();
  await quiz();
  await afterTest();
}
async function orderGame() {
  await burst(D.chat.order);
  const pool = shuffle([...D.items, ...D.decoys.slice(0, 2)]); let pos = 0, firstTry = true; orderScore = 0;
  const c = card(`<div class="chain">${D.items.map((_, i) => `<div class="slot" id="slot${i}"></div>${i < 5 ? '<span class="arrow">▶</span>' : ""}`).join("")}</div><div class="tiles four">${pool.map((it, i) => tile(it, "", `data-i="${i}"`)).join("")}</div>`);
  await new Promise(res => c.querySelectorAll("button.tile").forEach(b => b.onclick = async () => {
    const it = pool[+b.dataset.i];
    if (it.name === D.items[pos].name) {
      if (firstTry) orderScore++; b.disabled = true; b.classList.add("good");
      const s = c.querySelector("#slot" + pos); s.textContent = it.pic; s.classList.add("filled");
      const cheer = D.chat.cheer[pos]; pos++; firstTry = true;
      if (pos === 6) { await say(cheer); res(); } else if (pos % 2 === 0) say(cheer, { pause: 0 });
    } else { firstTry = false; b.classList.remove("shake"); void b.offsetWidth; b.classList.add("shake"); say(pos === 0 ? D.chat.nudgeFirst : D.chat.nudge[pos - 1], { pause: 0 }); }
  }));
  mine(`${orderScore} of 6 pehli baar mein`);
}
async function quiz() {
  quizScore = 0; await say(D.chat.quizIntro);
  for (const q of D.quiz) {
    await say(q.q, { big: true });
    const o = await ask(q.opts.map((t, i) => ({ label: t, i })));
    const ok = o.i === q.a; if (ok) quizScore++;
    await say(ok ? D.chat.correct[Math.floor(Math.random() * D.chat.correct.length)] : q.no);
  }
}
async function afterTest() {
  await burst(D.chat.afterIntro);
  await ask(["Ready"]);
  const right = await memoryTest(D.items, D.decoys);
  const before = S.before == null ? 0 : S.before;
  card(`<div class="compare"><div class="box"><b>${before}</b><span>bina trick</span></div><div class="muted">➜</div><div class="box after"><b>${right}</b><span>kahani ke saath</span></div></div>`);
  await say(right > before ? D.chat.afterBetter : D.chat.afterSame);
  const pts = 10 + orderScore * 10 + quizScore * 10;
  S.days[1] = { pts, date: today(), after: right }; S.scoreLog.push({ date: today(), pts, label: "Day 1" }); save(); syncFamily();
  await say(D.chat.scoreIntro);
  const c = card(`<div class="ring"><svg viewBox="0 0 160 160"><circle class="track" cx="80" cy="80" r="70"/><circle class="bar" id="bar" cx="80" cy="80" r="70"/></svg><div class="in"><span class="lbl">Brain score</span><span class="num" id="num">0</span></div></div><p class="muted center">${orderScore} of 6 order mein · ${quizScore} of 3 sawaal</p>`);
  await wait(60); c.querySelector("#bar").style.strokeDashoffset = 440 - 440 * pts / 100; let n = 0; const t = setInterval(() => { n = Math.min(pts, n + 3); c.querySelector("#num").textContent = n; if (n >= pts) clearInterval(t); }, 35);
  await say(pts >= 90 ? D.chat.scoreHi : pts >= 60 ? D.chat.scoreMid : D.chat.scoreLo);
  await say(D.chat.homework);
  await ask([{ label: "Home", primary: true }], { silent: true });
  home();
}

// ============ REVIEW, as a chat ============
async function review() {
  mode("chat"); chatEl.innerHTML = ""; stamp("Review · Day 1");
  await burst(A.chat.review);
  const c = card(`<h3>Jo yaad hain, un par tap kijiye</h3><div class="tiles four" id="pool"></div>`);
  const pool = shuffle([...D.items, ...D.decoys]); c.querySelector("#pool").innerHTML = pool.map((it, i) => tile(it, "", `data-i="${i}"`)).join(""); scroll();
  const chosen = new Set(); let right = 0;
  await new Promise(res => c.querySelectorAll(".tile").forEach(b => b.onclick = () => { const i = +b.dataset.i; chosen.has(i) ? chosen.delete(i) : chosen.add(i); b.classList.toggle("sel", chosen.has(i)); if (chosen.size && !replyEl.innerHTML) ask([{ label: "Ho gaya", primary: true }], { silent: true }).then(() => {
    const names = new Set(D.items.map(x => x.name)); c.querySelectorAll(".tile").forEach(x => { const it = pool[+x.dataset.i]; x.disabled = true; if (chosen.has(+x.dataset.i)) { x.classList.add(names.has(it.name) ? "good" : "miss"); if (names.has(it.name)) right++; } }); res(); }); }));
  S.lastReview = today(); save(); mine(`${right} of 6`);
  await say(right >= 5 ? A.chat.reviewGood : A.chat.reviewOk);
  await ask([{ label: "Home", primary: true }], { silent: true }); home();
}

// ============ HOME ============
tabsEl.querySelectorAll(".tab").forEach(t => t.onclick = () => ({ home, progress, family })[t.dataset.go]());
function tabs(on) { tabsEl.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", t.dataset.go === on)); }
function home() {
  mode("screen"); tabs("home");
  const done = S.days[1] && S.days[1].date === today();
  const due = S.days[1] && !done && [1, 3, 7].includes(daysAgo(S.days[1].date)) && S.lastReview !== today();
  const wk = ["So", "Mo", "Tu", "We", "Th", "Fr", "Sa"], now = new Date(), doneSet = new Set(Object.values(S.days).map(x => x.date));
  const week = Array.from({ length: 7 }, (_, i) => { const d = new Date(now); d.setDate(now.getDate() - now.getDay() + i); const iso = d.toISOString().slice(0, 10); return `<div><i class="${doneSet.has(iso) ? "on" : ""} ${iso === today() ? "today" : ""}"></i>${wk[i]}</div>`; }).join("");
  const slot = A.slots.find(s => s.id === S.slot) || A.slots[2];
  screenEl.innerHTML = `
    <h2>Namaste, ${S.name} 🙏</h2>
    <div class="hero"><div class="eyebrow">${done ? "Aaj ho gaya ✓" : "Aaj ka session"}</div><h2>Day 1 · ${D.title}</h2><p>${done ? "Kal Day 2 khulega. Chahein toh aaj ka phir se kheliye." : "3 minute. Priya ke saath chat."}</p><button class="btn" id="start">${done ? "Phir se kheliye" : "Chat shuru karein"}</button></div>
    ${due ? `<div class="hero" style="background:var(--warm);color:#1d1a2f"><b>1 minute ka review</b><p>Day 1 ki list abhi bhi yaad hai?</p><button class="btn" id="rev" style="background:#1d1a2f;color:#fff">Review karein</button></div>` : ""}
    <div class="stats"><div class="stat"><b>${brainScore()}</b><span>Brain score</span></div><div class="stat"><b>${streak()}</b><span>Din streak</span></div><div class="stat"><b>${Object.keys(S.days).length}</b><span>Din poore</span></div></div>
    <div class="week">${week}</div>
    <div class="stat" style="text-align:left;display:block"><b style="font-size:17px;font-family:var(--body)">Reminder: ${slot.label}, ${slot.time}</b><p class="muted">Phone par reminder ke liye app ko home screen par add kijiye.</p></div>
    <div class="path">
      <div class="day ${S.days[1] ? "done" : "next"}"><span class="n">1</span><div>Story Chain<small>Shopping list</small></div></div>
      <div class="day locked"><span class="n">2</span><div>Story Chain, level 2<small>Kal khulega</small></div></div>
      <div class="day locked"><span class="n">3</span><div>Story Chain, level 3<small>Lambi list</small></div></div>
      <div class="day locked"><span class="n">6</span><div>Memory Palace<small>Apne ghar ke kamre</small></div></div>
    </div>`;
  $("start").onclick = () => session(false); if (due) $("rev").onclick = review;
}

// ============ PROGRESS ============
function progress() {
  mode("screen"); tabs("progress");
  const log = S.scoreLog.slice(-10), W = 320, H = 160, px = i => 30 + i * ((W - 50) / Math.max(1, log.length - 1)), py = v => H - 20 - v / 100 * (H - 40);
  const chart = log.length ? `<svg class="chart" viewBox="0 0 ${W} ${H}"><line class="axis" x1="30" y1="${H - 20}" x2="${W - 10}" y2="${H - 20}"/><line class="axis" x1="30" y1="10" x2="30" y2="${H - 20}"/><text x="4" y="14">100</text><text x="12" y="${H - 16}">0</text>${log.length > 1 ? `<polyline class="line" points="${log.map((p, i) => `${px(i)},${py(p.pts)}`).join(" ")}"/>` : ""}${log.map((p, i) => `<circle class="dot" cx="${px(i)}" cy="${py(p.pts)}" r="5"/><text x="${px(i)}" y="${H - 6}" text-anchor="middle">${p.label}</text>`).join("")}</svg>` : `<p class="muted">Pehla session karne ke baad yahan graph dikhega.</p>`;
  const best = Math.max(0, ...S.scoreLog.map(p => p.pts));
  screenEl.innerHTML = `<h2>Aapka safar</h2>
    <div class="stats"><div class="stat"><b>${brainScore()}</b><span>Brain score</span></div><div class="stat"><b>${best}</b><span>Best</span></div><div class="stat"><b>${streak()}</b><span>Streak</span></div></div>
    <div class="stat" style="padding:12px">${chart}</div>
    <h2>Tricks seekhi</h2>
    <div class="badges"><div class="badge ${S.days[1] ? "on" : ""}"><span class="pic">🔗</span>Story Chain</div><div class="badge"><span class="pic">🏠</span>Memory Palace</div><div class="badge"><span class="pic">🙋</span>Naam aur chehre</div><div class="badge"><span class="pic">🔢</span>Numbers</div><div class="badge"><span class="pic">🔑</span>Kahan rakha</div><div class="badge"><span class="pic">📜</span>Lambi baatein</div></div>`;
}

// ============ FAMILY ============
let db = null, dbTried = false, unsub = null;
async function getDb() { if (!dbTried) { dbTried = true; try { db = await (window.claude && window.claude.use ? window.claude.use("db") : null); } catch (e) { db = null; } } return db; }
function myRow() { return { name: S.name || "Aap", score: brainScore(), streak: streak(), days: Object.keys(S.days).length, week: weekId(), weekPts: Object.values(S.days).filter(d => d.date >= weekStart()).reduce((a, d) => a + d.pts, 0), at: Date.now() }; }
async function syncFamily() { if (!S.family) return; const d = await getDb(); if (!d) return; try { await d.doc(`families/${S.family}/members/${S.id}`).set(myRow()); } catch (e) {} }
function family() {
  mode("screen"); tabs("family"); if (unsub) { unsub(); unsub = null; }
  if (!S.family) {
    screenEl.innerHTML = `<h2>Family board</h2><p class="muted">Ek code banaiye aur WhatsApp par bhejiye. Ya kisi ka code daaliye. Jo roz khelega, woh aage.</p><button class="btn" id="make">Naya family code banao</button><p class="center muted">ya</p><input type="text" class="plain" id="jc" placeholder="6 akshar ka code" maxlength="6" style="text-transform:uppercase"><button class="btn ghost" id="join">Join karo</button>`;
    $("make").onclick = () => { S.family = Array.from({ length: 6 }, () => "ABCDEFGHJKMNPQRSTUVWXYZ"[Math.floor(Math.random() * 23)]).join(""); save(); syncFamily(); family(); };
    $("join").onclick = () => { const c = $("jc").value.trim().toUpperCase(); if (c.length === 6) { S.family = c; save(); syncFamily(); family(); } };
    return;
  }
  screenEl.innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center"><h2>Family board</h2><button class="btn ghost" id="leave" style="width:auto;min-height:36px;padding:4px 12px;font-size:13px">Chhodo</button></div><div class="code">${S.family}</div><p class="muted center">Yeh code WhatsApp par bhejiye.</p><div id="board" style="display:grid;gap:8px"><p class="muted">Load ho raha hai...</p></div><p class="muted" id="note"></p>`;
  $("leave").onclick = () => { S.family = ""; save(); family(); };
  const render = rows => {
    const wk = weekId(); rows = rows.map(r => ({ ...r, weekPts: r.week === wk ? r.weekPts : 0 })).sort((a, b) => b.weekPts - a.weekPts || b.score - a.score);
    $("board").innerHTML = rows.map((r, i) => `<div class="member ${r.id === S.id ? "me" : ""}"><span class="rank">${i === 0 ? "👑" : i + 1}</span><span class="name">${r.name}<small>${r.streak} din streak · ${r.days} din poore</small></span><span class="pts">${r.weekPts}<small>is hafte</small></span><span class="pts">${r.score}<small>score</small></span></div>`).join("");
    const other = rows.find(r => r.id !== S.id && r.at && Date.now() - r.at < 86400000); $("note").textContent = other ? `${other.name} ne aaj apna session kar liya. Ab aapki baari.` : "";
  };
  render([{ id: S.id, ...myRow() }]);
  getDb().then(d => { if (!d) { $("note").textContent = "Family ke scores tab dikhenge jab app apni website par hogi. Abhi sirf aapka score."; return; } syncFamily(); try { unsub = d.collection(`families/${S.family}/members`).onSnapshot(snap => render(snap.docs.map(x => ({ id: x.id, ...x.data() })))); } catch (e) {} });
}
